<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>페이지 제목 | [쇼핑몰명]</title>
    <link rel="stylesheet" href="css/common.css">
    <!-- 페이지 전용 css는 common.css 아래에 -->
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <div class="container">

        <!-- ===== 공통 헤더 시작 ===== -->
        <header class="header">
            <div class="inner header-util">
                <a href="login.html">로그인</a>
                <a href="signup.html">회원가입</a>
                <a href="order-history.html">구매내역</a>
            </div>

            <div class="inner header-main">
                <a href="index.html" class="logo">
                    <img src="images/logo.png">
                </a>

                <form class="search" action="list.html" method="get" role="search">
                    <label for="search-q" class="sr-only">상품 검색</label>
                    <input id="search-q" type="search" name="q" placeholder="찾으시는 과일을 검색하세요">
                    <button type="submit" aria-label="검색">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" aria-hidden="true">
                            <circle cx="11" cy="11" r="7" />
                            <line x1="21" y1="21" x2="16.65" y2="16.65" />
                        </svg>
                    </button>
                </form>

                <div class="header-icons">
                    <a href="history.html" class="icon-btn" aria-label="마이페이지">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                            <circle cx="12" cy="8" r="4" />
                            <path d="M4 21c0-4 4-6 8-6s8 2 8 6" />
                        </svg>
                    </a>
                    <a href="cart.html" class="icon-btn" aria-label="장바구니">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L20 8H6.2" />
                            <circle cx="9" cy="20" r="1.4" />
                            <circle cx="17" cy="20" r="1.4" />
                        </svg>
                        <span class="icon-badge">2</span>
                    </a>
                </div>
            </div>

            <nav class="inner gnb" aria-label="카테고리 메뉴">
                <a href="list.html" class="gnb-all">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" aria-hidden="true">
                        <line x1="4" y1="6" x2="20" y2="6" />
                        <line x1="4" y1="12" x2="20" y2="12" />
                        <line x1="4" y1="18" x2="20" y2="18" />
                    </svg>
                    전체 카테고리
                </a>
                <span class="gnb-divider" aria-hidden="true"></span>
                <a href="list.html">베스트</a>
                <a href="list.html">신상품</a>
                <a href="list.html">특가</a>
                <a href="list.html">사과·배</a>
                <a href="list.html">감귤·만감류</a>
                <a href="list.html">포도·베리</a>
                <a href="list.html">수입과일</a>
                <a href="list.html">선물세트</a>
            </nav>
        </header>
        <!-- ===== 공통 헤더 끝 ===== -->

        <main class="auth-main">
            <div class="inner auth-inner">
                <h1 class="auth-title">로그인</h1>

                <form class="auth-form" action="/login" method="post">
                    <div class="form-group">
                        <label for="login-id" class="form-label">아이디</label>
                        <input type="text" id="login-id" name="userId" class="form-input" placeholder="아이디를 입력하세요"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="login-pw" class="form-label">비밀번호</label>
                        <input type="password" id="login-pw" name="userPw" class="form-input" placeholder="비밀번호를 입력하세요"
                            required>
                    </div>

                    <button type="submit" class="btn-auth-submit">로그인</button>
                </form>

                <div class="auth-links">
                    <a href="#">아이디 찾기</a>
                    <span class="divider" aria-hidden="true">|</span>
                    <a href="#">비밀번호 찾기</a>
                    <span class="divider" aria-hidden="true">|</span>
                    <a href="signup.html" class="link-bold">회원가입</a>
                </div>
            </div>
        </main>

        <!-- ===== 공통 푸터 시작 ===== -->
        <footer class="footer">
            <div class="inner footer-info">
                <p class="footer-company">[회사명]</p>
                <p>대표 [이름] | 사업자등록번호 [000-00-00000] | 통신판매업 [신고번호]</p>
                <p>주소 [주소] | 고객센터 [전화번호]</p>
            </div>
        </footer>
        <!-- ===== 공통 푸터 끝 ===== -->

    </div>
</body>

</html>
